services:
    _defaults:
        autowire: true
        autoconfigure: true
        public: false

    Flowd\Typo3Firewall\:
        resource: '../Classes/*'
        # Widgets depends on the optional typo3/cms-dashboard package,
        # Form/Finisher on the optional typo3/cms-form package, Reports on
        # the optional typo3/cms-reports package; all are registered
        # conditionally in Services.php instead.
        exclude:
            - '../Classes/Widgets/*'
            - '../Classes/Form/Finisher/*'
            - '../Classes/Reports/*'

    Flowd\Phirewall\Middleware:
        autowire: true
        public: true
        arguments:
            $config: '@Flowd\Phirewall\Config'

    Flowd\Typo3Firewall\Backend\Controller\FirewallController:
        autowire: true
        public: true
        arguments:
            $config: '@Flowd\Phirewall\Config'

    Flowd\Phirewall\Config:
        factory: ['@Flowd\Typo3Firewall\ConfigFactory', 'fromConfigurationFile']

    # Built via factory because the file path comes from the extension
    # configuration at runtime; autowiring is off so the constructor's
    # arguments are not mapped onto the factory method.
    Flowd\Typo3Firewall\Pattern\FileArrayPatternBackend:
        autowire: false
        autoconfigure: false
        factory: ['@Flowd\Typo3Firewall\Pattern\PatternBackendFactory', 'create']

    # Tag based registration because the AsEventListener attribute needs TYPO3 13.
    Flowd\Typo3Firewall\EventLog\FirewallEventLogListener:
        tags:
            - name: event.listener
              identifier: 'firewall-event-log/blocklist-matched'
              method: 'onBlocklistMatched'
            - name: event.listener
              identifier: 'firewall-event-log/throttle-exceeded'
              method: 'onThrottleExceeded'
            - name: event.listener
              identifier: 'firewall-event-log/fail2ban-matched'
              method: 'onFail2BanMatched'
            - name: event.listener
              identifier: 'firewall-event-log/fail2ban-banned'
              method: 'onFail2BanBanned'
            - name: event.listener
              identifier: 'firewall-event-log/fail2ban-blocked'
              method: 'onFail2BanBlocked'
            - name: event.listener
              identifier: 'firewall-event-log/allow2ban-banned'
              method: 'onAllow2BanBanned'
            - name: event.listener
              identifier: 'firewall-event-log/allow2ban-blocked'
              method: 'onAllow2BanBlocked'
            - name: event.listener
              identifier: 'firewall-event-log/safelist-matched'
              method: 'onSafelistMatched'
            - name: event.listener
              identifier: 'firewall-event-log/track-hit'
              method: 'onTrackHit'
            - name: event.listener
              identifier: 'firewall-event-log/firewall-error'
              method: 'onFirewallError'
